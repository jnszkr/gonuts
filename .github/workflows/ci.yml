name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go run ./cmd/gonuts generate --check --spec examples/shop/nuts.yaml --out examples/shop/gen
      - run: go run ./cmd/gonuts generate --check --spec examples/shop/nuts.yaml --terraform --terraform-out examples/shop/terraform
      - run: go run ./cmd/gonuts generate --check --spec examples/shop/nuts.yaml --permissions --permissions-out examples/shop/permissions
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: make test-terraform
  mutation:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make mutate
